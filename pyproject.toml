[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "eva"
version = "0.1.0a1"
description = "Eva — behavioral contract enforcement for AI agents"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [{name = "hop-top", email = "hello@hop-top.com"}]
keywords = ["ai", "agents", "contracts", "evaluation", "gateway", "llm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# Version strategy: >=x.y,<x+1 for stable deps; ==x.y.z for prototype deps (agntcy-acp)
# See docs/research/dependency-trust.md for rationale
dependencies = [
    "typer>=0.12",
    "rich>=13",
    "pluggy>=1.4",
    "sqlmodel>=0.0.21",
    "pyyaml>=6",
    "jsonschema>=4.23",
    "python-dotenv>=1",
    "httpx>=0.27",
    "redis>=5",
    "litellm>=1.82.0",
]

[project.urls]
Homepage = "https://github.com/hop-top/eva"
Repository = "https://github.com/hop-top/eva"
Documentation = "https://github.com/hop-top/eva/tree/main/docs"
"Bug Tracker" = "https://github.com/hop-top/eva/issues"

[project.scripts]
eva = "cli.main:app"
"eva-server" = "server.app:app"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "anyio[trio]>=4",
]
server = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "arq>=0.27,<1",
    "watchfiles>=0.21",
    "redis>=5",
]
redis = [
    "redis>=5",
]
llm = [
    "litellm>=1.82.0",
]
all = ["eva[dev,server,redis,llm]"]

[project.entry-points."eva.evaluators"]
# Third-party evaluator plugins register here

[project.entry-points."eva.storage"]
# Storage adapter plugins register here

[project.entry-points."eva.state"]
# State adapter plugins register here

[project.entry-points."eva.otel"]
# OTEL exporter plugins register here

[tool.hatch.build.targets.wheel]
packages = ["core", "cli", "server", "ee"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = ["--strict-markers", "-v"]
markers = [
    "asyncio: async tests",
    "integration: requires external services — run with --integration flag",
    "slow: slow-running tests",
    "e2e: end-to-end CLI tests via subprocess",
    "llm: tests that would make real LLM calls if not mocked",
]

[dependency-groups]
dev = [
    "respx>=0.22.0",
]
