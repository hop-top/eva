name: release-please

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

# One run per ref at a time; a newer push cancels the run in progress.
# Overlapping runs race: a run started before a release PR merged still
# sees the previous release, finishes after the merge, finds no open
# release PR and opens a new one for the version that was just tagged.
concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      # Mint a short-lived installation token from the hop-top release-bot
      # GitHub App so release PRs are opened by `release-bot[bot]` rather
      # than the human owner — sidesteps the CODEOWNERS self-approval block
      # on `.release-please-manifest.json` and avoids long-lived-PAT delivery
      # quirks.
      - uses: actions/create-github-app-token@v1
        id: app-token
        with:
          app-id: ${{ secrets.RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}

      - uses: googleapis/release-please-action@v4
        with:
          config-file: .github/release-please-config.json
          manifest-file: .github/.release-please-manifest.json
          token: ${{ steps.app-token.outputs.token }}
