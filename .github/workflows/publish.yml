name: publish

on:
  push:
    tags: ['*/v*']

jobs:
  publish:
    permissions:
      contents: read
      id-token: write  # required for PyPI OIDC trusted publishing
    uses: hop-top/.github/.github/workflows/publish-on-tag.yml@v0
    with:
      homepage: https://github.com/hop-top/eva
      # Single-language Python repo — no mirror. The `eva` ecosystem entry
      # uses `ecosystem: py` (picks the PyPI publish job) and omits any
      # `mirror:` field so the mirror-subtree job is skipped entirely.
      ecosystems: |
        eva:
          dir: .
          ecosystem: py
          package: eva
