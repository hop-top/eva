name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install
        run: uv pip install --system -e ".[dev,server]"

      - name: Test
        # tests/plugins/ require optional plugin packages (eva-a2a, eva-mcp,
        # eva-otlp, eva-agntcy, eva-postgres) that aren't declared in any
        # extra. Excluded to match the `make test` convention; install the
        # individual plugin packages and drop this --ignore if/when they
        # become first-class.
        run: uv run pytest tests/ -v --ignore=tests/e2e --ignore=tests/plugins
