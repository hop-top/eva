[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "eva-mcp"
version = "0.1.0"
description = "Eva Plugin — Import MCP server manifests as Eva contracts"
requires-python = ">=3.11"
dependencies = [
    "eva>=0.1.0",
    "pyyaml>=6",
    "typer>=0.12",
]

[project.scripts]
eva-mcp = "eva_mcp.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["eva_mcp"]
